<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk IT RS - {% block title %}Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-tools"></i> Helpdesk IT RS
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/tiket/baru"><i class="bi bi-plus-circle"></i> Tiket Baru</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/tiket"><i class="bi bi-list-ul"></i> Daftar Tiket</a>
                    </li>
                    <li class="nav-item" id="nav-arsip" style="display:none;">
                        <a class="nav-link" href="/tiket/arsip"><i class="bi bi-archive"></i> Arsip Tiket</a>
                    </li>
                    <li class="nav-item" id="nav-master" style="display:none;">
                        <a class="nav-link" href="/master"><i class="bi bi-gear"></i> Master Data</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <span class="text-light small" id="auth-username" style="display:none;"></span>
                    <a href="/login" class="btn btn-outline-light btn-sm" id="btn-login">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </a>
                    <button class="btn btn-outline-light btn-sm" id="btn-logout" style="display:none;" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                    <button class="btn btn-outline-light btn-sm" id="darkmode-toggle" onclick="toggleDarkMode()" title="Toggle Dark Mode">
                        <i class="bi bi-moon-fill" id="darkmode-icon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container-fluid py-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Toast container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast-notification" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toast-title">Notifikasi</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toast-message"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js?v=2"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
