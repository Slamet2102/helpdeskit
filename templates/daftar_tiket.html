{% extends "base.html" %}
{% block title %}Daftar Tiket{% endblock %}
{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3><i class="bi bi-list-ul"></i> Daftar Tiket</h3>
        <a href="/tiket/baru" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Tiket Baru
        </a>
    </div>

    <!-- Filters -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="filter-status">
                        <option value="">Semua Status</option>
                        <option value="Open">Open</option>
                        <option value="On Progress">On Progress</option>
                        <option value="Pending">Pending</option>
                        <option value="Selesai">Selesai</option>
                        <option value="Batal">Batal</option>
                        <option value="Rusak">Rusak</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Unit</label>
                    <select class="form-select" id="filter-unit">
                        <option value="">Semua Unit</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Cari</label>
                    <input type="text" class="form-control" id="filter-search" placeholder="Cari no tiket atau nama...">
                </div>
                <div class="col-md-1 d-grid">
                    <button class="btn btn-primary" onclick="loadTickets(1)">
                        <i class="bi bi-search"></i> Cari
                    </button>
                </div>
                <div class="col-md-3 d-grid gap-2 d-md-flex justify-content-md-end">
                    <!-- Arsipkan selalu terlihat -->
                    <button class="btn btn-outline-danger" onclick="archiveSelected()" title="Arsipkan tiket terpilih">
                        <i class="bi bi-archive"></i> Arsipkan
                    </button>
                    <!-- Export CSV selalu terlihat: export tiket terpilih, atau semua hasil filter jika tidak ada yang dipilih -->
                    <button class="btn btn-outline-success" id="btn-export-selected" onclick="exportSelectedCSV()" title="Export CSV (terpilih atau semua hasil filter)">
                        <i class="bi bi-file-earmark-spreadsheet"></i> Export CSV
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th style="width:40px;">
                                <input type="checkbox" class="form-check-input" id="select-all" onchange="toggleSelectAll(this.checked)" title="Pilih semua">
                            </th>
                            <th style="cursor:pointer;" onclick="toggleSort('nomor_tiket')">No Tiket <i class="bi bi-arrow-down-up sort-icon" id="sort-icon-nomor_tiket"></i></th>
                            <th style="cursor:pointer;" onclick="toggleSort('tanggal')">Tanggal <i class="bi bi-arrow-down-up sort-icon" id="sort-icon-tanggal"></i></th>
                            <th style="cursor:pointer;" onclick="toggleSort('nama_pelapor')">Pelapor <i class="bi bi-arrow-down-up sort-icon" id="sort-icon-nama_pelapor"></i></th>
                            <th>WhatsApp</th>
                            <th>Ruangan</th>
                            <th>Kerusakan</th>
                            <th style="cursor:pointer;" onclick="toggleSort('status')">Status <i class="bi bi-arrow-down-up sort-icon" id="sort-icon-status"></i></th>
                            <th>Durasi</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tiket-table-body">
                        <tr>
                            <td colspan="10" class="text-center">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
<nav class="pagination-wrapper">
                <ul class="pagination justify-content-center mb-0" id="pagination"></ul>
                <div class="total-tickets" id="total-tickets"></div>
            </nav>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let currentSortBy = 'tanggal';
let currentSortOrder = 'desc';

// Abort controller to cancel stale fetch requests
let abortController = null;

function getAbortSignal() {
    if (abortController) {
        abortController.abort();
    }
    abortController = new AbortController();
    return abortController.signal;
}

function toggleSort(column) {
    if (currentSortBy === column) {
        currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
    } else {
        currentSortBy = column;
        currentSortOrder = 'asc';
    }
    // Update icons
    document.querySelectorAll('.sort-icon').forEach(icon => {
        icon.className = 'bi bi-arrow-down-up sort-icon';
    });
    const icon = document.getElementById(`sort-icon-${column}`);
    if (icon) {
        icon.className = currentSortOrder === 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down';
    }
    loadTickets(1);
}

async function loadUnits() {
    const signal = getAbortSignal();
    try {
        const resp = await fetch('/api/master/units', { signal });
        const units = await resp.json();
        const select = document.getElementById('filter-unit');
        select.innerHTML = '<option value="">Semua Unit</option>' +
            units.map(u => `<option value="${u.id}">${u.nama_unit}</option>`).join('');
    } catch (err) {
        if (err.name === 'AbortError') return;
    }
}

function renderPagination(page, totalPages) {
    if (totalPages <= 1) return '';

    const maxButtons = 5;
    let start, end;

    if (totalPages <= maxButtons) {
        start = 1;
        end = totalPages;
    } else {
        // Window of maxButtons centered on current page
        start = Math.max(1, page - 2);
        end = Math.min(totalPages, start + maxButtons - 1);
        // Adjust start if end hits max
        start = Math.max(1, end - maxButtons + 1);
    }

    const prevDisabled = page <= 1 ? ' disabled' : '';
    const nextDisabled = page >= totalPages ? ' disabled' : '';
    const prevBtn = `<li class="page-item${prevDisabled}"><a class="page-link" href="#" onclick="loadTickets(${page - 1}); return false;" aria-label="Sebelumnya"><i class="bi bi-chevron-left"></i></a></li>`;
    const nextBtn = `<li class="page-item${nextDisabled}"><a class="page-link" href="#" onclick="loadTickets(${page + 1}); return false;" aria-label="Berikutnya"><i class="bi bi-chevron-right"></i></a></li>`;

    let items = [];
    if (start > 1) {
        items.push('<li class="page-item"><a class="page-link" href="#" onclick="loadTickets(1); return false;">1</a></li>');
        if (start > 2) {
            items.push('<li class="page-item disabled"><span class="page-link">&hellip;</span></li>');
        }
    }
    for (let i = start; i <= end; i += 1) {
        const active = i === page ? ' active' : '';
        items.push(`<li class="page-item${active}"><a class="page-link" href="#" onclick="loadTickets(${i}); return false;">${i}</a></li>`);
    }
    if (end < totalPages) {
        if (end < totalPages - 1) {
            items.push('<li class="page-item disabled"><span class="page-link">&hellip;</span></li>');
        }
        items.push(`<li class="page-item"><a class="page-link" href="#" onclick="loadTickets(${totalPages}); return false;">${totalPages}</a></li>`);
    }

    return prevBtn + items.join('') + nextBtn;
}

function loadTickets(page = 1) {
    // Uncheck select-all when reloading
    const selectAll = document.getElementById('select-all');
    if (selectAll) selectAll.checked = false;

    const status = document.getElementById('filter-status').value;
    const unitId = document.getElementById('filter-unit').value;
    const search = document.getElementById('filter-search').value;

    let url = `/api/tiket/?page=${page}&limit=15&sort_by=${currentSortBy}&sort_order=${currentSortOrder}`;
    if (status) url += `&status=${encodeURIComponent(status)}`;
    if (unitId) url += `&unit_id=${unitId}`;
    if (search) url += `&search=${encodeURIComponent(search)}`;

const signal = getAbortSignal();
    fetch(url, { signal })
        .then(async r => {
            const totalPages = Number(r.headers.get('x-total-pages') || 1);
            const totalCount = Number(r.headers.get('x-total-count') || 0);
            const data = await r.json();
            return { data, totalPages, totalCount };
        })
        .then(({ data, totalPages, totalCount }) => {
            const tbody = document.getElementById('tiket-table-body');
            const totalEl = document.getElementById('total-tickets');
            totalEl.innerHTML = `Total: <strong>${totalCount}</strong> tiket`;
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center">Tidak ada tiket ditemukan</td></tr>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            tbody.innerHTML = data.map(t => {
                const date = new Date(t.tanggal).toLocaleString('id-ID', {
                    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                const badgeClass = {
                    'Open': 'bg-danger',
                    'On Progress': 'bg-warning text-dark',
                    'Pending': 'bg-secondary',
                    'Selesai': 'bg-success'
                }[t.status] || 'bg-primary';

                return `<tr style="cursor:pointer;" onclick="location.href='/tiket/${t.id}'">
                    <td>
                        <input type="checkbox" class="form-check-input ticket-select" value="${t.id}" onclick="event.stopPropagation()">
                    </td>
                    <td><strong>${t.nomor_tiket}</strong></td>
                    <td>${date}</td>
                    <td>${t.nama_pelapor}</td>
                    <td>${t.no_whatsapp}</td>
                    <td>${t.unit?.nama_unit || '-'}</td>
                    <td>${t.kerusakan?.nama_kerusakan || '-'}</td>
                    <td><span class="badge ${badgeClass}">${t.status}</span></td>
                    <td>${t.durasi || '-'}</td>
                    <td>
                        <div class="btn-group" role="group">
                            <a href="/tiket/${t.id}" class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation()">
                                <i class="bi bi-eye"></i>
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="event.stopPropagation(); archiveTicket(${t.id})">
                                <i class="bi bi-archive"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
            }).join('');

            const pagination = document.getElementById('pagination');
            pagination.innerHTML = renderPagination(page, totalPages);
            currentPage = page;
        })
        .catch(err => {
            if (err.name === 'AbortError') return;
        });
}

async function archiveTicket(id) {
    if (!confirm('Pindahkan tiket ini ke arsip?')) return;
    const resp = await fetch(`/api/tiket/${id}`, { method: 'DELETE' });
    if (!resp.ok) {
        showToast('Gagal mengarsipkan tiket', 'error');
        return;
    }
    showToast('Tiket dipindahkan ke arsip', 'success');
    loadTickets(currentPage);
}

function getExportParams() {
    const status = document.getElementById('filter-status').value;
    const unitId = document.getElementById('filter-unit').value;
    const search = document.getElementById('filter-search').value;
    let params = [];
    if (status) params.push(`status=${encodeURIComponent(status)}`);
    if (unitId) params.push(`unit_id=${unitId}`);
    if (search) params.push(`search=${encodeURIComponent(search)}`);
    params.push(`sort_by=${currentSortBy}&sort_order=${currentSortOrder}`);
    return params.join('&');
}

function exportCSV() {
    const params = getExportParams();
    window.location.href = `/api/tiket/export?${params}&format=csv`;
}

// ===== Checklist / Batch Functions =====

function toggleSelectAll(checked) {
    document.querySelectorAll('.ticket-select').forEach(cb => {
        cb.checked = checked;
    });
}

function getSelectedIds() {
    return Array.from(document.querySelectorAll('.ticket-select:checked'))
        .map(cb => parseInt(cb.value));
}

async function archiveSelected() {
    const ids = getSelectedIds();
    if (ids.length === 0) {
        showToast('Tidak ada tiket yang dipilih', 'warning');
        return;
    }
    if (!confirm(`Arsipkan ${ids.length} tiket terpilih?`)) return;

    try {
        const resp = await fetch('/api/tiket/batch/archive', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids })
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            showToast(err.detail || 'Gagal mengarsipkan tiket', 'error');
            return;
        }
        showToast(`${ids.length} tiket berhasil diarsipkan`, 'success');
        loadTickets(currentPage);
    } catch (err) {
        showToast('Terjadi kesalahan jaringan', 'error');
    }
}

function exportSelectedCSV() {
    const ids = getSelectedIds();
    if (ids.length === 0) {
        // Tidak ada yang dipilih -> export semua tiket sesuai filter aktif
        exportCSV();
        return;
    }
    const idsParam = ids.join(',');
    const params = getExportParams();
    window.location.href = `/api/tiket/export?${params}&ids=${idsParam}&format=csv`;
}

// Export PDF disembunyikan sementara

loadUnits();
loadTickets();
</script>
{% endblock %}
