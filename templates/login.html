<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Helpdesk IT RS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
        }
        .login-card .card-body {
            padding: 2.5rem;
        }
        .login-logo {
            font-size: 3rem;
            color: #0d6efd;
        }
        .login-title {
            font-weight: 700;
            color: #333;
        }
        .login-subtitle {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }
        .btn-login {
            padding: 0.6rem 1.5rem;
            font-weight: 600;
            border-radius: 0.5rem;
        }
        .alert {
            display: none;
        }
        .alert.show {
            display: block;
        }
        .back-link {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div>
        <div class="card login-card">
            <div class="card-body text-center">
                <div class="login-logo mb-3">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h3 class="login-title mb-1">Helpdesk IT RS</h3>
                <p class="login-subtitle mb-4">Masuk ke panel administrasi</p>

                <div class="alert alert-danger" id="login-error" role="alert">
                    <i class="bi bi-exclamation-triangle me-1"></i>
                    <span id="error-message">Username atau password salah</span>
                </div>

                <form id="login-form" autocomplete="off">
                    <div class="mb-3 text-start">
                        <label for="username" class="form-label">
                            <i class="bi bi-person me-1"></i>Username
                        </label>
                        <input type="text" class="form-control form-control-lg" id="username"
                               placeholder="Masukkan username" required autofocus>
                    </div>
                    <div class="mb-4 text-start">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock me-1"></i>Password
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password"
                               placeholder="Masukkan password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-login w-100" id="btn-login">
                        <span id="btn-text">Masuk</span>
                        <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </form>
            </div>
        </div>
        <div class="text-center mt-3">
            <a href="/" class="back-link">
                <i class="bi bi-arrow-left me-1"></i>Kembali ke Dashboard
            </a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('login-error');
            const errorMsg = document.getElementById('error-message');
            const btnLogin = document.getElementById('btn-login');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            // Reset error
            errorEl.classList.remove('show');

            if (!username || !password) {
                errorMsg.textContent = 'Username dan password harus diisi';
                errorEl.classList.add('show');
                return;
            }

            // Loading state
            btnLogin.disabled = true;
            btnText.textContent = 'Memproses...';
            btnSpinner.classList.remove('d-none');

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.detail || 'Login gagal');
                }

                const data = await resp.json();

                // Store token
                localStorage.setItem('auth_token', data.access_token);
                localStorage.setItem('auth_username', data.username);
                localStorage.setItem('auth_role', data.role);

                // Redirect to previous page or home
                const redirect = new URLSearchParams(window.location.search).get('next') || '/';
                window.location.href = redirect;
            } catch (err) {
                errorMsg.textContent = err.message || 'Terjadi kesalahan saat login';
                errorEl.classList.add('show');
            } finally {
                btnLogin.disabled = false;
                btnText.textContent = 'Masuk';
                btnSpinner.classList.add('d-none');
            }
        });

        // Enter key to submit
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
